<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户注册</title>
    <style>
        body {
            margin: 50px;
            text-align: center;
            background: url("{{ url_for('static', filename='image/background2.png') }}") no-repeat center center / cover fixed;
            background-color: rgba(0,0,0,0.1);
            background-blend-mode: overlay;
            min-height: 100vh;
            padding-top: 50px;
            box-sizing: border-box;
        }

        .container {
            width: 400px;
            margin: 0 auto;
            text-align: left;
            padding: 25px;
            border-radius: 8px;
            /* ========== 磨砂玻璃核心样式 ========== */
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.8);
            box-shadow: 0 0 15px rgba(0,0,0,0.08);
        }

        /* ===== 核心：全屏标题栏（高度为页面1/12） ===== */
        .header-bar {
            width: 100%;
            height: calc(100vh / 12); /* 页面高度的1/12 */
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 20px;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(6px);
            border-bottom: 1px solid rgba(40,167,69,0.2);
            position: fixed; /* 固定在页面顶部 */
            top: 0;
            left: 0;
            z-index: 999; /* 确保在最上层 */
        }
        /* AI图标样式 */
        .header-bar .ai-icon {
            font-size: 22px;
            /* ========== 核心：图标渐变代码（和标题文字一模一样） ========== */
            background: linear-gradient(90deg, #1565c0, #42a5f5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
            /* 可选增强：图标加粗（让渐变更饱满，按需加） */
            font-weight: 900;
        }

        /* 标题文字样式：圆润醒目 */
        .header-bar .title-text {
            font-size: 20px;
            font-weight: 600;
            /* ========== 新增：深蓝色渐变文字（核心代码） ==========

            */
            background: linear-gradient(90deg, #1565c0, #42a5f5);
            -webkit-background-clip: text; /* 核心：把渐变背景裁剪到文字上（webkit内核兼容） */
            -webkit-text-fill-color: transparent; /* 核心：文字填充为透明，露出渐变背景 */
            background-clip: text; /* 标准写法，兼容现代浏览器 */
            text-fill-color: transparent;
            /* ========== 保留原有特性 ========== */
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif; /* 字体圆润不变 */
            letter-spacing: 2px; /* 字间距舒展不变 */
        }

        /* 表单标题居中优化，视觉更协调 */
        .container h2 {
            text-align: center;
            margin: 0 0 20px 0;
            color: #333;
            font-size: 20px;
        }
        /* 外层容器：文字+输入框 左右水平排布核心样式 */
        .form-item {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            margin-bottom: 18px;
            gap: 12px; /* 文字与输入框间距，过渡自然不拥挤 */
        }
        /* 表单文字标签：固定宽度+右对齐，视觉统一 */
        .form-item label {
            flex: 0 0 90px;
            text-align: right;
            font-size: 14px;
            color: #333;
            white-space: nowrap;
        }
        /* 输入框样式优化：精致化+丝滑过渡 */
        .form-item input {
            flex: 1;
            padding: 9px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            transition: all 0.3s ease-in-out;
            background-color: #fff;
        }
        /* 输入框聚焦高亮：柔和阴影+绿色边框 */
        .form-item input:focus {
            border-color: #28a745;
            outline: none;
            box-shadow: 0 0 8px rgba(40, 167, 69, 0.25);
        }
        /* 提交按钮：缩小尺寸+完美居中+精致动效（核心优化） */
        form button[type="submit"] {
            display: block;
            width: 30%; /* 按钮缩小，更精致 */
            padding: 8px 0;
            background-color: #28a745;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease-in-out;
            margin: 20px auto 0; /* 水平居中+上下间距 */
        }
        /* 按钮悬停/点击交互增强 */
        form button[type="submit"]:hover {
            background-color: #218838;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(40, 167, 69, 0.2);
        }
        form button[type="submit"]:active {
            transform: translateY(0);
            box-shadow: none;
        }
        /* 错误提示样式保留不变 */
        .error {color: red;font-size: 12px;text-align: center;margin-bottom: 10px;}
    </style>
    <!-- 引入RSA加密前端库（在线CDN，无需本地下载） -->
    <script src="https://cdn.bootcdn.net/ajax/libs/jsencrypt/3.3.2/jsencrypt.min.js"></script>

    <!-- 引入Font Awesome 6.x 图标库（免费版，包含brain/fox/robot等AI相关图标） -->
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
<!-- ===== 左上角：标题+图标展示栏（核心新增） ===== -->
<div class="header-bar">
    <i class="ai-icon fa-solid fa-paw"></i>
    <div class="title-text">AI大模型灵狐</div>
</div>

<div class="container">

    <h2>用户注册</h2>
    <!-- 错误提示：Jinja2渲染后端flash消息 -->
    {% with messages = get_flashed_messages() %}
    {% if messages %}
    {% for msg in messages %}
    <div class="error">{{ msg }}</div>
    {% endfor %}
    {% endif %}
    {% endwith %}

    <!-- 注册表单：提交到当前路由，禁止浏览器默认提交 -->
    <form id="registerForm" method="post" action = "{{ url_for('login.register') }}">
        <div class="form-item">
            <label>用户名：</label>
            <input type="text" name="username" required placeholder="请输入用户名">
        </div>
        <div class="form-item">
            <label>密码：</label>
            <input type="password" id="password" required placeholder="请输入密码">
            <!-- 隐藏域：存储RSA加密后的密码密文，传给后端 -->
            <input type="hidden" name="password" id="encryptPwd">
        </div>
        <div class="form-item">
            <label>电话：</label>
            <input type="text" id="phone" name="phone" required placeholder="请输手机号">
        </div>
        <div class="form-item">
            <label>邮箱：</label>
            <input type="text" id="email" name="email" placeholder="请输邮箱信息">
        </div>
        <button type="submit">立即注册</button>
    </form>
    <div style="margin-top:15px;text-align:center;">
        已有账号？<a href="{{ url_for('login.login') }}">立即登录</a>
    </div>
</div>

<script>
        // 初始化RSA加密对象
        const encrypt = new JSEncrypt();
        // 加载后端传入的RSA公钥（Jinja2渲染）
        encrypt.setPublicKey(`{{ rsa_public_key }}`);

        // 表单提交事件：先加密密码，再提交
        document.getElementById("registerForm").onsubmit = function(e) {
            // 1. 获取明文密码
            const plainPwd = document.getElementById("password").value;
            // 2. RSA公钥加密密码 → 密文（前端核心加密逻辑）
            const cipherPwd = encrypt.encrypt(plainPwd);
            // 3. 将密文写入隐藏域，传给后端
            document.getElementById("encryptPwd").value = cipherPwd;
            return true;
        }
    </script>
</body>
</html>
